
name: 01 - Java Build and Unit Tests

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: 

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Verify project structure
      - name: Verify Maven Project Structure
        run: |
          echo "Checking project structure..."

          test -d src/main/java/com/example
          test -d src/test/java/com/example

          test -f pom.xml
          test -f src/main/java/com/example/App.java
          test -f src/test/java/com/example/AppTest.java

          echo "Project structure verified successfully!"

      # Step 4: Compile Java application
      - name: Maven Clean Compile
        run: mvn clean compile

      # Step 5: Execute unit tests
      - name: Run JUnit Tests
        run: mvn test

      # Step 6: Package application
      - name: Generate JAR Package
        run: mvn package

      # Step 7: Upload JAR artifact
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

