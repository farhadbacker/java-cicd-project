
name: 03 - Publish and Deploy

on:
  workflow_run:
    workflows:
      - "02 - SonarQube Analysis"
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    name: Publish Maven Package

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.repository.full_name == github.repository

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout the exact source commit
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Step 2: Set up Java and Maven authentication
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Step 3: Download artifact from Pipeline 2
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          path: downloaded-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      # Step 4: Verify downloaded artifact
      - name: Verify JAR Artifact
        run: |
          echo "Checking downloaded JAR..."

          find downloaded-artifact -type f -name "*.jar"

          test -n "$(find downloaded-artifact -type f -name '*.jar')"

          echo "JAR artifact downloaded successfully!"

      # Step 5: Publish Maven package
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn -B deploy -DskipTests

